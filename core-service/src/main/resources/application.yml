spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: ${SPRING_NAME}
  profiles:
    active: dev

  mvc:
    async:
      request-timeout: ${CHAT_ASYNC_TIMEOUT_MS:180000}

  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 41MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # PHẢI khớp "Authorized redirect URIs" trong Google Cloud Console.
            # Mặc định trỏ qua gateway (8080); set GOOGLE_REDIRECT_URI để override.
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: email

jwt:
  # Bắt buộc cung cấp qua env (core-service/env hoặc environment variable) — không có default.
  secret: ${JWT_SECRET}
  access-token:
    expiration: 3600000    # 1 hour in milliseconds
  refresh-token:
    expiration: 604800000  # 7 days in milliseconds

app:
  password-reset:
    from: ${MAIL_FROM:noreply@edugraph.local}
  oauth2:
    frontend-success-url: ${FRONTEND_SUCCESS_URL:http://localhost:5173/auth/callback}
    frontend-failure-url: ${FRONTEND_FAILURE_URL:http://localhost:5173/auth/error}
  supabase:
    url: ${SUPABASE_URL}
    secret-key: ${SUPABASE_SECRET_KEY}
    bucket-name: ${SUPABASE_STORAGE_BUCKET:course-materials}

# AI core-service (Python FastAPI, edugraph-ai-core) — chỉ nội bộ, không public.
ai-core:
  base-url: ${AI_CORE_URL:http://localhost:8082}
  # PHẢI khớp INTERNAL_API_KEY trong .env của edugraph-ai-core (không commit giá trị).
  internal-key: ${AI_CORE_INTERNAL_KEY:dummy_key}
  connect-timeout-ms: 5000
  # Timeout đọc cho các call đồng bộ (status/chat/learning-path); /ingest chỉ trả ack nên không bị ảnh hưởng.
  read-timeout-ms: 30000
  status-poll-interval-ms: 15000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    oauth2-redirect-url: http://localhost:8080/swagger-ui/oauth2-redirect.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-swallow-size: 100MB
  # Tôn trọng X-Forwarded-* từ gateway để OAuth2 baseUrl/redirect_uri = gateway (8080)
  forward-headers-strategy: framework
