<!doctype html>
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{title}}</title>
  <style>
    body, table, td, p, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table { border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; }
    @media only screen and (max-width:600px) {
      .email-shell { padding:24px 12px !important; }
      .email-content { padding:28px 24px !important; }
      .email-header { padding:28px 24px !important; }
      .email-title { font-size:28px !important; line-height:36px !important; }
      .email-code { font-size:34px !important; letter-spacing:6px !important; }
      .email-footer { padding:22px 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f2f5fa;color:#172b4d;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f2f5fa;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f5fa;">
    <tr><td class="email-shell" align="center" style="padding:48px 20px;">
      <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr><td style="padding:0 4px 22px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td width="40" height="40" align="center" valign="middle" style="background-color:#0056d2;border-radius:12px;color:#ffffff;font-size:24px;font-weight:700;">E</td>
            <td style="padding-left:12px;font-size:23px;letter-spacing:-0.7px;font-weight:700;color:#15365e;">EduGraph-RAG</td>
          </tr></table>
        </td></tr>
        <tr><td style="background-color:#ffffff;border:1px solid #e0e7f0;border-radius:20px;overflow:hidden;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr><td height="5" style="height:5px;background-color:#0056d2;font-size:0;line-height:0;">&nbsp;</td></tr>
            <tr><td class="email-header" style="padding:36px 40px 30px;background-color:#edf4ff;border-bottom:1px solid #dce8fa;">
              <p style="margin:0 0 14px;font-size:11px;line-height:18px;letter-spacing:2px;font-weight:700;color:#0056d2;">{{eyebrow}}</p>
              <h1 class="email-title" style="margin:0;font-size:32px;line-height:41px;letter-spacing:-1px;font-weight:700;color:#102f56;">{{heading}}</h1>
              <p style="margin:12px 0 0;font-size:15px;line-height:25px;color:#526884;">{{intro}}</p>
            </td></tr>
            <tr><td class="email-content" style="padding:32px 40px 36px;font-size:15px;line-height:25px;">{{content}}</td></tr>
            <tr><td class="email-footer" style="padding:24px 40px;background-color:#f8fafc;border-top:1px solid #e8edf4;">
              <p style="margin:0;font-size:13px;line-height:21px;color:#60718a;">Email tự động từ EduGraph-RAG. Vui lòng không trả lời email này.</p>
              <p style="margin:8px 0 0;font-size:12px;line-height:20px;color:#79879b;">Kết nối tri thức. Mở lối học tập.</p>
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:22px 12px 0;font-size:12px;line-height:20px;color:#7b889c;">EduGraph-RAG &nbsp;&middot;&nbsp; Học tập từ những kết nối</td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
