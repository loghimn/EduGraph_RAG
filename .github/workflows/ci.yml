name: Backend CI and images
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
      - name: Validate CPU and GPU Compose configurations
        env:
          BACKEND_TAG: sha-0000000000000000000000000000000000000000
          FRONTEND_TAG: sha-0000000000000000000000000000000000000000
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yml config --quiet
          docker compose --env-file deploy/.env.example -f deploy/compose.yml -f deploy/compose.gpu.yml --profile tunnel config --quiet
      - name: Test deployment failure and rollback handling
        shell: pwsh
        run: ./deploy/tests/deploy.Tests.ps1

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [core-service, gateway-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        working-directory: ${{ matrix.service }}
        run: bash mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-tests-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: edugraph-ai-core
    env:
      INTERNAL_API_KEY: ci-test-only
      EMBEDDING_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: edugraph-ai-core/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Unit and API tests without external services
        run: python -m pytest -q -m "not integration and not slow" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-tests
          path: edugraph-ai-core/test-results.xml

  containers:
    needs: [java, python, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-service
            variant: cpu
            suffix: ''
            torch-index: https://download.pytorch.org/whl/cpu
          - service: gateway-service
            variant: cpu
            suffix: ''
            torch-index: https://download.pytorch.org/whl/cpu
          - service: edugraph-ai-core
            variant: cpu
            suffix: ''
            torch-index: https://download.pytorch.org/whl/cpu
          - service: edugraph-ai-core
            variant: gpu
            suffix: '-gpu'
            torch-index: https://download.pytorch.org/whl/cu121
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${OWNER,,}/edugraph/${SERVICE}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: TORCH_INDEX_URL=${{ matrix.torch-index }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.variant }}
