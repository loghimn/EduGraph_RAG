# gateway-service — Spring Cloud Gateway 5.x (WebFlux)
# Giá trị cấu hình/quan trọng nằm trong file `gateway-service/env` (đã gitignore):
#   GATEWAY_PORT       default 8080
#   CORE_SERVICE_URL   default http://localhost:8081
#   JWT_SECRET         secret HS256 — PHẢI trùng với core-service
#   CORS_ALLOWED_ORIGINS  comma-separated, KHÔNG dùng "*"

server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:gateway-service}
  # Env file được nạp qua Dotenv trong GatewayServiceApplication.main() (file `env` cùng thư mục)
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: core-api
              uri: ${CORE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
            - id: core-swagger
              uri: ${CORE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/v3/api-docs/swagger-config
            - id: core-oauth2
              uri: ${CORE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/oauth2/**,/login/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowedMethods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
                allowedHeaders: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Requested-With,X-CSRF-Token}
                allowCredentials: true
                maxAge: 3600

jwt:
  # Bắt buộc cung cấp qua env (gateway-service/env hoặc environment variable) — không có default.
  secret: ${JWT_SECRET}

gateway:
  security:
    # Comma-separated path patterns; /** suffix supported.
    public-paths: ${GATEWAY_PUBLIC_PATHS:/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/logout,/api/auth/logout-all,/api/auth/google/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**,/v3/api-docs/swagger-config,/oauth2/**,/login/**,/error}
